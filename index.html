<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="description" content="掌中榫局——用自然手势探索传统榫卯结构的三维互动体验。">
  <title>掌中榫局｜手势交互解密</title>
  <link rel="stylesheet" href="assets/landing/hero-image.css?v=1">
  <style>
    :root {
      --paper: #f4ead0;
      --gold: #e2b95f;
      --gold-soft: #ffe4a2;
      --ink: #090b0a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }

    .hero {
      position: relative;
      min-height: 100%;
      isolation: isolate;
      background:
        linear-gradient(90deg, rgba(5, 8, 7, .98) 0%, rgba(5, 8, 7, .94) 28%, rgba(5, 8, 7, .76) 43%, rgba(5, 8, 7, .12) 68%, rgba(5, 8, 7, .08) 100%),
        var(--hero-image) center / cover no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 69% 67%, rgba(236, 164, 61, .2), transparent 26%),
        linear-gradient(180deg, rgba(0, 0, 0, .14), transparent 45%, rgba(0, 0, 0, .34));
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      opacity: .08;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .masthead {
      position: absolute;
      top: clamp(24px, 4.5vh, 58px);
      left: clamp(24px, 5vw, 78px);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 2px solid var(--gold-soft);
      color: var(--gold-soft);
      font: 500 24px "STKaiti", "KaiTi", serif;
      transform: rotate(30deg);
      box-shadow: 0 0 20px rgba(226, 185, 95, .12);
    }

    .brand-mark span { transform: rotate(-30deg); }

    .brand-name {
      font-family: "STKaiti", "KaiTi", serif;
      font-size: clamp(19px, 1.8vw, 29px);
      letter-spacing: .16em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .8);
    }

    .copy {
      position: absolute;
      left: clamp(28px, 8.7vw, 146px);
      top: 50%;
      z-index: 5;
      width: min(630px, 44vw);
      transform: translateY(-45%);
    }

    .title-wrap { position: relative; display: inline-block; }

    h1 {
      margin: 0;
      color: #fff3d4;
      font: 600 clamp(62px, 8vw, 132px) "STKaiti", "KaiTi", "FangSong", serif;
      line-height: .98;
      letter-spacing: .04em;
      text-shadow: 0 5px 0 rgba(125, 75, 25, .65), 0 15px 38px rgba(0, 0, 0, .75);
    }

    .cloud {
      position: absolute;
      right: -76px;
      bottom: -18px;
      width: 148px;
      height: 35px;
      border-radius: 60% 40% 55% 45%;
      background: linear-gradient(90deg, transparent, rgba(30, 116, 102, .82));
      filter: drop-shadow(0 4px 7px rgba(0, 0, 0, .7));
      transform: skewX(-18deg);
    }

    .mode {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 34px 0 18px;
      color: #f0dfae;
      font-family: "STSong", "SimSun", serif;
      font-size: clamp(18px, 2vw, 30px);
      letter-spacing: .25em;
    }

    .mode::before, .mode::after {
      content: "";
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
      opacity: .8;
    }

    .mode::before { width: 95px; }
    .mode::after { width: 58px; background: linear-gradient(90deg, var(--gold), transparent); }

    .tagline {
      margin: 0 0 40px 112px;
      color: rgba(244, 234, 208, .82);
      font-family: "STSong", "SimSun", serif;
      font-size: clamp(15px, 1.4vw, 22px);
      letter-spacing: .12em;
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-width: 300px;
      margin-left: 112px;
      padding: 17px 34px;
      border: 1px solid rgba(101, 61, 17, .5);
      border-radius: 999px;
      color: #261b0c;
      background: linear-gradient(180deg, #fff8e4, #efd9a4);
      box-shadow: 0 0 0 3px rgba(255, 234, 184, .35), 0 14px 42px rgba(0, 0, 0, .42);
      font-family: "STSong", "SimSun", serif;
      font-size: 24px;
      letter-spacing: .08em;
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
    }

    .start-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.04);
      box-shadow: 0 0 0 3px rgba(255, 234, 184, .52), 0 18px 50px rgba(0, 0, 0, .5);
    }

    .start-button:active { transform: translateY(0); }
    .start-button .arrow { font-family: system-ui, sans-serif; font-size: 30px; line-height: 1; }

    .footer-note {
      position: absolute;
      left: clamp(24px, 5vw, 78px);
      bottom: 26px;
      z-index: 5;
      color: rgba(244, 234, 208, .44);
      font-size: 10px;
      letter-spacing: .24em;
    }

    @media (max-width: 820px) {
      .hero {
        background:
          linear-gradient(180deg, rgba(5, 8, 7, .18), rgba(5, 8, 7, .45) 44%, rgba(5, 8, 7, .98) 73%),
          var(--hero-image) 65% center / cover no-repeat;
      }

      .masthead { top: 20px; left: 20px; }
      .brand-mark { width: 40px; height: 40px; font-size: 19px; }
      .copy { left: 24px; right: 24px; top: auto; bottom: 64px; width: auto; transform: none; }
      h1 { font-size: clamp(54px, 17vw, 82px); }
      .cloud { right: -18px; width: 100px; }
      .mode { margin: 20px 0 13px; font-size: 17px; gap: 10px; }
      .mode::before { width: 42px; }
      .mode::after { width: 30px; }
      .tagline { margin: 0 0 24px; font-size: 14px; }
      .start-button { min-width: 230px; margin-left: 0; padding: 14px 28px; font-size: 20px; }
      .footer-note { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .start-button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <header class="masthead" aria-label="掌中榫局">
      <div class="brand-mark" aria-hidden="true"><span>榫</span></div>
      <div class="brand-name">掌中榫局</div>
    </header>

    <section class="copy" aria-labelledby="heroTitle">
      <div class="title-wrap">
        <h1 id="heroTitle">掌中榫局</h1>
        <span class="cloud" aria-hidden="true"></span>
      </div>
      <div class="mode">手势交互解密</div>
      <p class="tagline">以指为钥，探寻千年榫卯之美</p>
      <a class="start-button" href="tutorial.html">开始体验 <span class="arrow" aria-hidden="true">→</span></a>
    </section>

    <div class="footer-note">HAND GESTURE · MORTISE AND TENON</div>
  </main>
</body>
</html>
