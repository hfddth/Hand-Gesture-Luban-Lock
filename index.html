<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0a">
  <meta name="description" content="掌中榫局——以自然手势探索传统榫卯结构。">
  <title>掌中榫局｜手势交互解密</title>
  <link rel="stylesheet" href="assets/landing/hero-image.css?v=2">
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090b0a;
    }

    .cover {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      overflow: hidden;
    }

    .artboard {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max(100vw, 177.683vh);
      height: max(100vh, 56.2804vw);
      transform: translate(-50%, -50%);
      background: var(--hero-image) center / 100% 100% no-repeat;
    }

    /* 点击区域严格对应原图中的“开始体验”按钮，不添加任何可见图层。 */
    .start-hotspot {
      position: absolute;
      left: 16.25%;
      top: 60.35%;
      width: 20.55%;
      height: 9.75%;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .start-hotspot:focus-visible {
      outline: 3px solid #fff0c5;
      outline-offset: 4px;
    }

  </style>
</head>
<body>
  <main class="cover" aria-label="掌中榫局首页">
    <div class="artboard">
      <a class="start-hotspot" href="tutorial.html" aria-label="开始体验，进入手势教程"></a>
    </div>
  </main>
</body>
</html>
