    async function startCamera(){const b=$("cameraBtn");b.disabled=true;try{if(typeof Hands==="undefined"||typeof Camera==="undefined")throw new Error("手势资源未加载");const hands=new Hands({locateFile:f=>`https://unpkg.com/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.62,minTrackingConfidence:.68});hands.onResults(handResults);const cam=new Camera(video,{onFrame:async()=>hands.send({image:video}),width:640,height:480});await cam.start();$("camShade").style.display="none";$("camStatus").textContent="识别中";$("camStatus").classList.add("live");b.textContent="手势识别已开启"}catch(e){b.disabled=false;$("camStatus").textContent="开启失败";showToast("资源或摄像头不可用，请在系统浏览器中打开并允许权限");console.error(e)}}
    $("startBtn").onclick=()=>{$("intro").classList.add("hidden");started=true};$("cameraBtn").onclick=startCamera;$("hintBtn").onclick=()=>showToast(clues[Math.min(solved,5)]);$("resetBtn").onclick=reset;$("againBtn").onclick=()=>{reset();$("success").classList.add("hidden")};
    const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();world.rotation.x=THREE.MathUtils.lerp(world.rotation.x,targetWorldRotX,.12);world.rotation.y=THREE.MathUtils.lerp(world.rotation.y,targetWorldRotY,.12);if(selected)selected.group.position.lerp(dragTarget,.38);pieces.forEach((p,i)=>{if(!p.removed&&!selected&&i===order[solved])p.group.scale.setScalar(1+Math.sin(t*2.5)*.006)});renderer.render(scene,camera)}animate();
    addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateUI();
  </script>
