<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>机关修复演示｜掌中榫局</title><link rel="stylesheet" href="assets/landing/scene-v3.css"><link rel="stylesheet" href="assets/landing/burr-level-v36.css?v=36"><link rel="stylesheet" href="assets/repair/repair-demo.css?v=1"><link rel="stylesheet" href="assets/repair/campaign.css?v=54"><script type="module" src="assets/repair/campaign.mjs?v=53"></script><script src="assets/landing/particles.js?v=3" defer></script></head><body>
<header><a class="brand" href="./">◇ <span>掌中榫局<small>构件归位 · 机关联动</small></span></a><h1 id="campaignTitle">机关修复</h1></header><main>
<div id="modelView" class="model-view" tabindex="0" aria-label="机关工作台，拖动构件到对应接口"></div>
<aside class="scroll-panel"><div class="scroll-rod top"></div><div class="paper"><h2 id="taskTitle">让机关重获生机</h2><div class="paper-rule">◇</div><p id="taskCopy">先安装玉石轴承，<br>再归位齿轮与摇柄。</p><p class="progress">已归位 <strong id="solvedCount">0</strong> / <span id="totalParts">3</span></p><ol class="repair-parts" id="pieceList"></ol><p class="scroll-foot">拿起 → 靠近 → 松开</p><p id="lesson"></p><button id="undoButton" class="undo">↶ 撤销上一步</button></div><div class="scroll-rod bottom"></div></aside>
<section class="camera-card" aria-label="摄像头预览"><div class="camera-view"><video id="video" autoplay playsinline muted hidden></video><canvas id="handCanvas" hidden></canvas><div id="cameraPlaceholder"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34"/><path d="M22 30h22v24H22Zm22 7 13-8v26l-13-9M16 64 65 15"/></svg><p>摄像头未开启</p></div></div><button id="cameraButton" class="paper-button">开启摄像头</button><p id="cameraStatus" aria-live="polite">鼠标也可完成修复</p></section>
<nav class="tools" aria-label="工作台工具"><button id="hintButton"><span>?</span>线索</button><button id="resetLevel" aria-label="重置关卡"><span>⟳</span>重置关卡</button><button id="pauseButton"><span>Ⅱ</span>暂停</button></nav>
<a class="back-link" href="levels.html?mode=repair&v=35">‹ 返回关卡</a><div class="tray-pages"><button id="trayPrev" aria-label="上一组构件">‹</button><span id="trayLabel"></span><button id="trayNext" aria-label="下一组构件">›</button></div><button id="runButton" class="paper-button run-button">启动机关 →</button><p id="interactionNote" class="interaction-note" role="status">捏合抓取零件 · 鼠标拖动空白旋转装置台</p><span id="pointerDot" hidden aria-hidden="true"></span></main><canvas class="ambient" aria-hidden="true"></canvas>
<dialog id="pauseDialog"><h2>稍歇片刻</h2><button id="resumeButton" class="paper-button">继续修复</button><a href="levels.html?mode=repair&v=35">返回关卡</a></dialog>
<dialog id="failureDialog" aria-labelledby="failureTitle" aria-describedby="failureCopy"><button id="closeFailure" class="failure-close" aria-label="关闭提示">×</button><h2 id="failureTitle">机关未能运转</h2><p id="failureCopy">无法转动呢，是不是哪里出错了？</p><button id="continueRepair" class="paper-button">继续检查</button></dialog>
<dialog id="successDialog" aria-labelledby="successTitle"><p class="dialog-kicker">机关修复 · 完成</p><h2 id="successTitle">机关重鸣</h2><p>轴有所依，轮有所合。<br>旧机关，重新运转。</p><button id="nextLevelButton" class="paper-button">下一关 →</button><button id="replayButton" class="paper-button">再修复一次</button><a href="levels.html?mode=repair&v=35">返回关卡</a></dialog><noscript>请启用 JavaScript 运行机关修复演示。</noscript></body></html>
