<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10100d" />
  <title>榫卯之间｜鲁班锁手势教学</title>
  <style>
    :root {
      --paper: #eee6d2;
      --ink: #24231e;
      --muted: #99927f;
      --gold: #d7a94b;
      --jade: #62b49a;
      --red: #ba5349;
      --panel: rgba(24, 23, 19, .84);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10100d;
      color: var(--paper);
      font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    button { font: inherit; }

    #scene {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 52% 40%, rgba(108, 95, 62, .15), transparent 33%),
        linear-gradient(145deg, #171712, #0c0c0a 70%);
    }

    #scene canvas { display: block; }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .brand {
      position: fixed;
      left: 28px;
      top: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 13px;
      letter-spacing: .1em;
    }

    .seal {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(215, 169, 75, .76);
      color: var(--gold);
      font-family: serif;
      line-height: 1;
      writing-mode: vertical-rl;
      font-size: 14px;
    }

    .brand strong {
      display: block;
      font-family: "STKaiti", "KaiTi", serif;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: .16em;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .24em;
    }

    .steps {
      position: fixed;
      top: 30px;
      left: 50%;
      z-index: 10;
      display: flex;
      gap: 7px;
      transform: translateX(-50%);
    }

    .step-dot {
      width: 32px;
      height: 3px;
      border: 0;
      border-radius: 99px;
      background: rgba(238, 230, 210, .18);
      transition: width .35s ease, background .35s ease;
    }

    .step-dot.done { background: rgba(98, 180, 154, .5); }
    .step-dot.active { width: 58px; background: var(--gold); }

    .lesson {
      position: fixed;
      left: 28px;
      bottom: 28px;
      z-index: 12;
      width: min(430px, calc(100vw - 56px));
      padding: 23px 24px 20px;
      border: 1px solid rgba(238, 230, 210, .15);
      background: linear-gradient(135deg, rgba(34, 32, 25, .92), rgba(20, 20, 17, .84));
      box-shadow: 0 22px 70px rgba(0, 0, 0, .34);
      backdrop-filter: blur(16px);
    }

    .lesson::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 18px;
      bottom: 18px;
      width: 2px;
      background: var(--gold);
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .22em;
    }

    #lessonTitle {
      margin: 9px 0 6px;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: clamp(25px, 3.2vw, 34px);
      font-weight: 500;
    }

    #lessonText {
      min-height: 45px;
      margin: 0;
      color: #c8c1af;
      font-size: 14px;
      line-height: 1.7;
    }

    .lesson-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid rgba(238, 230, 210, .1);
      color: #918a78;
      font-size: 11px;
    }

    .kbd {
      padding: 2px 7px;
      border: 1px solid rgba(238, 230, 210, .18);
      border-radius: 4px;
      color: #c8c1af;
    }

    .camera-card {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 12;
      width: 238px;
      border: 1px solid rgba(238, 230, 210, .14);
      background: rgba(19, 19, 16, .82);
      box-shadow: 0 16px 45px rgba(0, 0, 0, .34);
      overflow: hidden;
    }

    .camera-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 35px;
      padding: 0 11px;
      color: #aaa28e;
      font-size: 10px;
      letter-spacing: .13em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #aaa28e;
      letter-spacing: 0;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #777;
      box-shadow: 0 0 0 3px rgba(119, 119, 119, .12);
    }

    .status.live::before {
      background: var(--jade);
      box-shadow: 0 0 0 3px rgba(98, 180, 154, .13);
    }

    .camera-view {
      position: relative;
      height: 165px;
      background: #090908;
    }

    #video, #handCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #handCanvas { pointer-events: none; }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: #766f60;
      font-size: 12px;
      line-height: 1.6;
      background: radial-gradient(circle, #1d1c17, #0a0a09);
    }

    .camera-actions {
      display: flex;
      gap: 7px;
      padding: 9px;
    }

    .camera-actions button, .intro button, .success-card button {
      cursor: pointer;
      border: 1px solid rgba(215, 169, 75, .45);
      color: var(--paper);
      background: rgba(215, 169, 75, .1);
      transition: background .2s, border-color .2s, transform .2s;
    }

    .camera-actions button {
      flex: 1;
      padding: 8px;
      font-size: 11px;
    }

    button:hover { background: rgba(215, 169, 75, .19); border-color: var(--gold); }
    button:active { transform: translateY(1px); }

    .cursor {
      position: fixed;
      z-index: 20;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(238, 230, 210, .86);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: width .14s, height .14s, border-color .14s, opacity .2s;
    }

    .cursor::after {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .cursor.visible { opacity: 1; }
    .cursor.pinching { width: 19px; height: 19px; color: var(--gold); border-color: var(--gold); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 30;
      padding: 9px 16px;
      border: 1px solid rgba(238, 230, 210, .16);
      color: #cfc7b3;
      background: rgba(20, 20, 17, .86);
      font-size: 12px;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .intro, .success {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(9, 9, 7, .74);
      backdrop-filter: blur(12px);
      transition: opacity .45s ease, visibility .45s ease;
    }

    .intro.hidden, .success.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .intro-card, .success-card {
      width: min(560px, 100%);
      padding: 42px;
      border: 1px solid rgba(238, 230, 210, .17);
      background: linear-gradient(145deg, rgba(39, 37, 29, .96), rgba(17, 17, 14, .96));
      text-align: center;
      box-shadow: 0 35px 100px rgba(0, 0, 0, .5);
    }

    .intro-mark {
      width: 74px;
      height: 74px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(215, 169, 75, .5);
      color: var(--gold);
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 34px;
      transform: rotate(45deg);
    }

    .intro-mark span { transform: rotate(-45deg); }

    .intro h1, .success-card h2 {
      margin: 0;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 400;
      letter-spacing: .12em;
    }

    .intro p, .success-card p {
      max-width: 420px;
      margin: 16px auto 26px;
      color: #aaa28f;
      font-size: 14px;
      line-height: 1.9;
    }

    .intro button, .success-card button {
      min-width: 176px;
      padding: 12px 24px;
      letter-spacing: .14em;
    }

    .intro-note {
      display: block;
      margin-top: 14px;
      color: #706a5c;
      font-size: 11px;
    }

    .success-ring {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border: 1px solid var(--jade);
      border-radius: 50%;
      color: var(--jade);
      font-size: 28px;
    }

    .mode-pill {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 10;
      padding: 8px 11px;
      border: 1px solid rgba(238, 230, 210, .12);
      color: #817a69;
      background: rgba(20, 20, 17, .72);
      font-size: 10px;
      letter-spacing: .1em;
    }

    @media (max-width: 760px) {
      .brand { left: 16px; top: 15px; }
      .seal { width: 36px; height: 36px; }
      .brand strong { font-size: 18px; }
      .steps { top: 70px; }
      .camera-card { top: 94px; right: 12px; width: 150px; }
      .camera-view { height: 105px; }
      .camera-head { height: 30px; }
      .camera-actions { padding: 6px; }
      .lesson { left: 12px; bottom: 12px; width: calc(100vw - 24px); padding: 18px 18px 15px; }
      .lesson-foot { display: none; }
      .mode-pill { display: none; }
      .intro-card, .success-card { padding: 32px 22px; }
    }
  </style>
</head>
<body>
  <main id="scene" aria-label="鲁班锁三维教学场景"></main>
  <div class="grain"></div>

  <header class="brand">
    <div class="seal">榫卯</div>
    <div><strong>榫卯之间</strong><span>SPATIAL HANDCRAFT</span></div>
  </header>

  <nav class="steps" aria-label="教学进度">
    <button class="step-dot active" aria-label="步骤一"></button>
    <button class="step-dot" aria-label="步骤二"></button>
    <button class="step-dot" aria-label="步骤三"></button>
    <button class="step-dot" aria-label="步骤四"></button>
    <button class="step-dot" aria-label="步骤五"></button>
  </nav>

  <section class="lesson" aria-live="polite">
    <div class="eyebrow" id="stepNumber">壹 · 初识构件</div>
    <h2 id="lessonTitle">伸出食指，指向榫木</h2>
    <p id="lessonText">将食指移动到发光的木构件上。识别成功后，构件边缘会变成金色。</p>
    <div class="lesson-foot">
      <span id="actionHint">摄像头模式：保持手掌正对镜头</span>
      <span><span class="kbd">鼠标</span> 可备用操作</span>
    </div>
  </section>

  <aside class="camera-card" aria-label="摄像头手势预览">
    <div class="camera-head">
      <span>手势识别</span>
      <span class="status" id="cameraStatus">未开启</span>
    </div>
    <div class="camera-view">
      <div class="camera-placeholder" id="cameraPlaceholder">开启摄像头后<br>将手放入画面</div>
      <video id="video" autoplay muted playsinline></video>
      <canvas id="handCanvas"></canvas>
    </div>
    <div class="camera-actions">
      <button id="cameraButton" type="button">开启摄像头</button>
      <button id="resetButton" type="button">重新教学</button>
    </div>
  </aside>

  <div class="cursor" id="gestureCursor"></div>
  <div class="toast" id="toast"></div>
  <div class="mode-pill" id="modePill">鼠标：拖拽移动 · 滚轮旋转 · 松开安装</div>

  <section class="intro" id="intro">
    <div class="intro-card">
      <div class="intro-mark"><span>锁</span></div>
      <h1>鲁班锁 · 入门</h1>
      <p>用一只手完成指向、捏合、移动、转腕与放置，认识无钉木构的基本连接方式。</p>
      <button type="button" id="startButton">开始教学</button>
      <span class="intro-note">推荐使用桌面版 Chrome 或 Edge，并允许摄像头权限</span>
    </div>
  </section>

  <section class="success hidden" id="success">
    <div class="success-card">
      <div class="success-ring">✓</div>
      <div class="eyebrow">教学完成</div>
      <h2>合木成锁</h2>
      <p>你已经掌握基础空间手势。真正的鲁班锁通过构件之间的咬合保持稳定，不依赖钉子或胶水。</p>
      <button type="button" id="againButton">再试一次</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const sceneRoot = document.getElementById("scene");
    const video = document.getElementById("video");
    const handCanvas = document.getElementById("handCanvas");
    const handCtx = handCanvas.getContext("2d");
    const cameraButton = document.getElementById("cameraButton");
    const resetButton = document.getElementById("resetButton");
    const startButton = document.getElementById("startButton");
    const againButton = document.getElementById("againButton");
    const cameraStatus = document.getElementById("cameraStatus");
    const cameraPlaceholder = document.getElementById("cameraPlaceholder");
    const cursorEl = document.getElementById("gestureCursor");
    const toastEl = document.getElementById("toast");
    const introEl = document.getElementById("intro");
    const successEl = document.getElementById("success");
    const stepNumber = document.getElementById("stepNumber");
    const lessonTitle = document.getElementById("lessonTitle");
    const lessonText = document.getElementById("lessonText");
    const actionHint = document.getElementById("actionHint");
    const dots = [...document.querySelectorAll(".step-dot")];

    const lessons = [
      ["壹 · 初识构件", "伸出食指，指向榫木", "将食指移动到发光的木构件上。识别成功后，构件边缘会变成金色。"],
      ["贰 · 凌空取物", "捏合拇指与食指", "在指向构件时轻轻捏合一次即可锁定抓取，手指回弹也不会让构件脱落。"],
      ["叁 · 移木就位", "移动手掌，靠近安装区", "抓取会持续保持。移动手掌，将木构件平稳带到中央虚线轮廓附近。"],
      ["肆 · 转腕正形", "转动手腕，调整方向", "保持抓取并转动手腕，让榫木与虚线轮廓的方向接近。鼠标模式可使用滚轮。"],
      ["伍 · 落榫成锁", "张开手掌，完成放置", "构件进入绿色容错范围并调整方向后，持续张开手掌即可释放，不需要与虚线完全重合。"]
    ];

    let tutorialStarted = false;
    let currentStep = 0;
    let grabbed = false;
    let hovered = false;
    let grabCandidate = null;
    let grabCandidateAt = 0;
    let pinchStable = false;
    let pinchFrames = 0;
    let openPalmFrames = 0;
    let handVisible = false;
    let missingHandFrames = 0;
    let smoothedLandmarks = null;
    let smoothedCursorX = null;
    let smoothedCursorY = null;
    let smoothedPinchRatio = null;
    let previousWristAngle = null;
    let accumulatedRotation = 0;
    let inSnapRange = false;
    let cameraRunning = false;
    let toastTimer = 0;
    let mouseDown = false;
    let mouseMovedDistance = 0;
    let mouseStart = new THREE.Vector2();

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x10100d, 0.035);

    const camera3d = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
    camera3d.position.set(0, 2.5, innerWidth / innerHeight < 1.45 ? 15.4 : 12.5);
    camera3d.lookAt(0, .25, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    sceneRoot.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xd9ceb0, 0x171712, 1.5));
    const keyLight = new THREE.SpotLight(0xffd98a, 70, 35, Math.PI / 5, .55, 1.2);
    keyLight.position.set(-5, 9, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x6fbda4, 19, 22);
    rimLight.position.set(7, 3, -3);
    scene.add(rimLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ color: 0x151510, roughness: .92, metalness: .02 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2.15;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(25, 25, 0x474132, 0x28261f);
    grid.position.y = -2.13;
    grid.material.transparent = true;
    grid.material.opacity = .27;
    scene.add(grid);

    const woodTexture = makeWoodTexture();
    const woodMaterial = new THREE.MeshStandardMaterial({
      map: woodTexture,
      color: 0xb97a3e,
      roughness: .63,
      metalness: .02
    });
    const darkWoodMaterial = woodMaterial.clone();
    darkWoodMaterial.color.set(0x7b4c27);

    const lockGroup = new THREE.Group();
    lockGroup.position.set(1.35, .05, 0);
    scene.add(lockGroup);

    const fixedA = makeBeam(darkWoodMaterial, 5.4, .82, .82);
    fixedA.rotation.z = Math.PI / 2;
    fixedA.rotation.x = .16;
    fixedA.position.set(.1, 0, 0);
    lockGroup.add(fixedA);

    const fixedB = makeBeam(woodMaterial, 5.2, .8, .8);
    fixedB.rotation.y = Math.PI / 2;
    fixedB.rotation.z = -.1;
    fixedB.position.set(0, -.12, .02);
    lockGroup.add(fixedB);

    const targetMaterial = new THREE.MeshBasicMaterial({
      color: 0xd7a94b,
      wireframe: true,
      transparent: true,
      opacity: .25,
      depthWrite: false
    });
    const target = new THREE.Mesh(new THREE.BoxGeometry(5.1, .78, .78), targetMaterial);
    target.position.set(1.35, .13, .03);
    target.rotation.z = .62;
    scene.add(target);

    const movable = makeBeam(woodMaterial.clone(), 5.1, .78, .78);
    movable.position.set(-3.4, .1, .35);
    movable.rotation.z = -.55;
    movable.userData.baseY = movable.position.y;
    scene.add(movable);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(movable.geometry),
      new THREE.LineBasicMaterial({ color: 0xd7a94b, transparent: true, opacity: 0 })
    );
    movable.add(edges);

    const floorRing = new THREE.Mesh(
      new THREE.RingGeometry(1.35, 1.39, 64),
      new THREE.MeshBasicMaterial({ color: 0xd7a94b, transparent: true, opacity: .22, side: THREE.DoubleSide })
    );
    floorRing.rotation.x = -Math.PI / 2;
    floorRing.position.set(target.position.x, -2.1, .1);
    scene.add(floorRing);

    // 教学关采用宽松判定：构件与虚线区域明显重叠且方向大致一致即可吸附成功。
    const POSITION_TOLERANCE = 3.6;
    const NEAR_TARGET_DISTANCE = 4.35;
    const ROTATION_TOLERANCE = 1.05;

    const motes = createMotes();
    scene.add(motes);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(-10, -10);
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -.35);
    const planeHit = new THREE.Vector3();
    const dragTarget = new THREE.Vector3();
    const dragVelocity = new THREE.Vector3();
    const dragDelta = new THREE.Vector3();
    const DRAG_INPUT_DEADZONE = .035;
    const DRAG_SETTLE_DISTANCE = .012;
    const initialPosition = movable.position.clone();
    const initialRotation = movable.rotation.clone();

    function makeWoodTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 0, 128);
      grad.addColorStop(0, "#c38a50");
      grad.addColorStop(.5, "#a96935");
      grad.addColorStop(1, "#8c532b");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 128);
      ctx.globalAlpha = .32;
      for (let y = 10; y < 128; y += 12) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= 512; x += 24) {
          ctx.lineTo(x, y + Math.sin(x * .035 + y) * 4 + Math.sin(x * .012) * 3);
        }
        ctx.strokeStyle = y % 24 === 0 ? "#5b321d" : "#e6b374";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.repeat.set(2.8, 1);
      return texture;
    }

    function makeBeam(material, x, y, z) {
      const geometry = new THREE.BoxGeometry(x, y, z, 3, 1, 1);
      geometry.translate(0, 0, 0);
      const beam = new THREE.Mesh(geometry, material);
      beam.castShadow = true;
      beam.receiveShadow = true;
      return beam;
    }

    function createMotes() {
      const points = [];
      for (let i = 0; i < 180; i++) {
        points.push((Math.random() - .5) * 24, Math.random() * 10 - 2, (Math.random() - .5) * 13 - 2);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(points, 3));
      return new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0xd8c493, size: .022, transparent: true, opacity: .34 }));
    }

    function setStep(index) {
      currentStep = Math.max(0, Math.min(4, index));
      const data = lessons[currentStep];
      stepNumber.textContent = data[0];
      lessonTitle.textContent = data[1];
      lessonText.textContent = data[2];
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentStep);
        dot.classList.toggle("done", i < currentStep);
      });
    }

    function nextStep(expected) {
      if (currentStep !== expected || !tutorialStarted) return;
      setStep(Math.min(4, currentStep + 1));
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1700);
    }

    function resetTutorial() {
      tutorialStarted = true;
      grabbed = false;
      hovered = false;
      grabCandidate = null;
      grabCandidateAt = 0;
      pinchStable = false;
      pinchFrames = 0;
      openPalmFrames = 0;
      missingHandFrames = 0;
      smoothedLandmarks = null;
      smoothedCursorX = null;
      smoothedCursorY = null;
      smoothedPinchRatio = null;
      accumulatedRotation = 0;
      inSnapRange = false;
      previousWristAngle = null;
      mouseDown = false;
      movable.position.copy(initialPosition);
      dragTarget.copy(initialPosition);
      dragVelocity.set(0, 0, 0);
      movable.rotation.copy(initialRotation);
      movable.scale.setScalar(1);
      movable.material.emissive.setHex(0x000000);
      target.material.opacity = .25;
      target.material.color.setHex(0xd7a94b);
      floorRing.material.color.setHex(0xd7a94b);
      edges.material.opacity = 0;
      successEl.classList.add("hidden");
      setStep(0);
      showToast("教学已重置");
    }

    function setPointerFromScreen(x, y) {
      pointer.x = (x / innerWidth) * 2 - 1;
      pointer.y = -(y / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera3d);
    }

    function updateHover() {
      if (!tutorialStarted || grabbed) return;
      const hit = raycaster.intersectObject(movable, true).length > 0;
      hovered = hit;
      if (hit) {
        // 记录捏合前最后一次稳定指向，随后捏合造成的手指抖动不会改变选择。
        grabCandidate = movable;
        grabCandidateAt = performance.now();
      }
      edges.material.opacity = THREE.MathUtils.lerp(edges.material.opacity, hit ? .95 : 0, .24);
      movable.material.emissive.setHex(hit ? 0x3b2b0c : 0x000000);
      if (hit && currentStep === 0) {
        nextStep(0);
        showToast("已找到榫木，捏合抓取");
      }
    }

    function beginGrab() {
      const candidateIsFresh = grabCandidate === movable && performance.now() - grabCandidateAt < 700;
      if (!candidateIsFresh || grabbed || !tutorialStarted) return false;
      grabbed = true;
      pinchStable = true;
      openPalmFrames = 0;
      dragTarget.copy(movable.position);
      dragVelocity.set(0, 0, 0);
      movable.scale.setScalar(1.035);
      edges.material.opacity = 1;
      nextStep(1);
      showToast("抓取已锁定，张开手掌才会释放");
      return true;
    }

    function updateGrabPosition() {
      if (!grabbed) return;
      if (!raycaster.ray.intersectPlane(dragPlane, planeHit)) return;
      planeHit.x = THREE.MathUtils.clamp(planeHit.x, -5.2, 5.2);
      planeHit.y = THREE.MathUtils.clamp(planeHit.y, -2.4, 3.6);
      // 输入端设置死区：手指的微小抖动不会持续改写目标位置。
      if (dragTarget.distanceTo(planeHit) > DRAG_INPUT_DEADZONE) {
        dragTarget.copy(planeHit);
      }
      const moved = dragTarget.distanceTo(initialPosition);
      if (currentStep === 2 && moved > 1.1) nextStep(2);
      const targetDistance = dragTarget.distanceTo(target.position);
      inSnapRange = targetDistance < POSITION_TOLERANCE;
      target.material.color.setHex(inSnapRange ? 0x62b49a : 0xd7a94b);
      floorRing.material.color.setHex(inSnapRange ? 0x62b49a : 0xd7a94b);
      if (targetDistance < NEAR_TARGET_DISTANCE && currentStep < 3) {
        setStep(3);
        showToast("已接近安装区，请调整方向");
      }
    }

    function updateSmoothDrag() {
      if (!grabbed) return;
      dragDelta.copy(dragTarget).sub(movable.position);
      const distance = dragDelta.length();
      if (distance > DRAG_SETTLE_DISTANCE) {
        // 弹性速度追踪让摄像头的低帧率坐标在渲染帧之间形成连续路线。
        const response = THREE.MathUtils.clamp(.18 + distance * .035, .18, .42);
        dragDelta.multiplyScalar(response);
        dragVelocity.lerp(dragDelta, .5);
      } else {
        dragVelocity.multiplyScalar(.58);
      }
      if (dragVelocity.length() > .34) dragVelocity.setLength(.34);
      if (distance < DRAG_SETTLE_DISTANCE && dragVelocity.length() < .0015) {
        dragVelocity.set(0, 0, 0);
        return;
      }
      movable.position.add(dragVelocity);
    }

    function applyWristRotation(angle) {
      if (!grabbed) return;
      if (previousWristAngle === null) {
        previousWristAngle = angle;
        return;
      }
      let delta = angle - previousWristAngle;
      if (delta > Math.PI) delta -= Math.PI * 2;
      if (delta < -Math.PI) delta += Math.PI * 2;
      // 转腕设置死区并限制单帧变化，避免静止时来回颤动。
      if (Math.abs(delta) < .018) return;
      delta = THREE.MathUtils.clamp(delta, -.065, .065);
      movable.rotation.z += delta * .62;
      accumulatedRotation += Math.abs(delta);
      previousWristAngle = angle;
      if (currentStep === 3 && accumulatedRotation > .28) {
        nextStep(3);
        showToast("方向已调整，请张开手掌放置");
      }
    }

    function finishGrab() {
      if (!grabbed) return;
      grabbed = false;
      hovered = false;
      grabCandidate = null;
      grabCandidateAt = 0;
      pinchStable = false;
      pinchFrames = 0;
      openPalmFrames = 0;
      previousWristAngle = null;
      dragVelocity.set(0, 0, 0);
      movable.scale.setScalar(1);
      const distance = movable.position.distanceTo(target.position);
      const angleError = Math.abs(normalizeAngle(movable.rotation.z - target.rotation.z));
      if (distance < POSITION_TOLERANCE && angleError < ROTATION_TOLERANCE) {
        movable.position.copy(target.position);
        movable.rotation.copy(target.rotation);
        target.material.opacity = 0;
        edges.material.opacity = 0;
        movable.material.emissive.setHex(0x14372c);
        setTimeout(() => successEl.classList.remove("hidden"), 700);
        showToast("严丝合缝，安装完成");
      } else {
        setStep(Math.max(2, currentStep - 1));
        showToast(distance >= POSITION_TOLERANCE ? "再靠近绿色安装范围" : "方向还差一点，请继续旋转");
      }
    }

    function normalizeAngle(value) {
      return Math.atan2(Math.sin(value), Math.cos(value));
    }

    async function startCamera() {
      if (cameraRunning) return;
      cameraButton.disabled = true;
      cameraStatus.textContent = "连接中";
      try {
        if (typeof Hands === "undefined" || typeof Camera === "undefined") {
          throw new Error("手势模型资源未加载");
        }
        const hands = new Hands({
          locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: .62,
          minTrackingConfidence: .68
        });
        hands.onResults(onHandResults);
        const inputCamera = new Camera(video, {
          onFrame: async () => hands.send({ image: video }),
          width: 640,
          height: 480
        });
        await inputCamera.start();
        cameraRunning = true;
        cameraPlaceholder.style.display = "none";
        cameraStatus.textContent = "识别中";
        cameraStatus.classList.add("live");
        cameraButton.textContent = "摄像头已开启";
        actionHint.textContent = "摄像头模式：捏合锁定抓取 · 张开手掌释放";
        showToast("摄像头已开启，请将手放入画面");
      } catch (error) {
        cameraStatus.textContent = "开启失败";
        cameraStatus.classList.remove("live");
        cameraButton.disabled = false;
        cameraPlaceholder.style.display = "grid";
        cameraPlaceholder.innerHTML = "摄像头未能开启<br>可继续使用鼠标完成教学";
        showToast("请检查摄像头权限，或使用鼠标操作");
        console.error(error);
      }
    }

    function onHandResults(results) {
      const width = handCanvas.width = video.videoWidth || 640;
      const height = handCanvas.height = video.videoHeight || 480;
      handCtx.clearRect(0, 0, width, height);
      const rawMarks = results.multiHandLandmarks?.[0];
      handVisible = Boolean(rawMarks);
      cursorEl.classList.toggle("visible", handVisible);
      if (!rawMarks) {
        missingHandFrames++;
        pinchFrames = 0;
        openPalmFrames = 0;
        // 短暂丢失手部追踪时仍保持抓取，只让物体停在最后的稳定位置。
        if (grabbed) dragVelocity.multiplyScalar(.55);
        if (missingHandFrames > 12) resetTrackingFilters(grabbed);
        return;
      }

      missingHandFrames = 0;
      const marks = smoothHandLandmarks(rawMarks);
      drawSkeleton(marks, width, height);
      const index = marks[8];
      const thumb = marks[4];
      const wrist = marks[0];
      const middleBase = marks[9];
      const targetX = (1 - index.x) * innerWidth;
      const targetY = index.y * innerHeight;
      if (smoothedCursorX === null) {
        smoothedCursorX = targetX;
        smoothedCursorY = targetY;
      } else {
        const cursorDistance = Math.hypot(targetX - smoothedCursorX, targetY - smoothedCursorY);
        if (cursorDistance > 1.2) {
          const cursorAlpha = THREE.MathUtils.clamp(.42 + cursorDistance / 650, .42, .7);
          smoothedCursorX += (targetX - smoothedCursorX) * cursorAlpha;
          smoothedCursorY += (targetY - smoothedCursorY) * cursorAlpha;
        }
      }
      const screenX = smoothedCursorX;
      const screenY = smoothedCursorY;
      cursorEl.style.left = `${screenX}px`;
      cursorEl.style.top = `${screenY}px`;
      setPointerFromScreen(screenX, screenY);

      const pinchDistance = Math.hypot(index.x - thumb.x, index.y - thumb.y);
      const palmSize = Math.max(.04, Math.hypot(marks[5].x - marks[17].x, marks[5].y - marks[17].y));
      const pinchRatio = pinchDistance / palmSize;
      smoothedPinchRatio = smoothedPinchRatio === null
        ? pinchRatio
        : THREE.MathUtils.lerp(smoothedPinchRatio, pinchRatio, .28);
      const pinchingNow = smoothedPinchRatio < .34;
      const pinchIntent = pinchRatio < .48 || pinchingNow;
      const openPalmNow = smoothedPinchRatio > .58 && isOpenPalm(marks);
      cursorEl.classList.toggle("pinching", grabbed || pinchingNow);
      // 捏合开始后不再重新射线选物，沿用动作开始前锁定的候选构件。
      if (!grabbed && !pinchIntent) updateHover();

      if (!grabbed) {
        openPalmFrames = 0;
        if (pinchingNow) {
          pinchFrames++;
          if (!pinchStable && pinchFrames >= 2) {
            if (!beginGrab()) pinchFrames = 0;
          }
        } else {
          pinchFrames = 0;
          pinchStable = false;
        }
      } else {
        // 抓取是锁存状态：捏合松动、手指短暂遮挡都不会触发释放。
        pinchStable = true;
        pinchFrames = 0;
        if (openPalmNow) {
          openPalmFrames++;
        } else {
          openPalmFrames = 0;
        }
        if (openPalmFrames >= 4) {
          finishGrab();
        }
      }

      // 进入张掌释放姿势后冻结目标点，避免手指伸展把构件带离安装位置。
      if (grabbed && !openPalmNow) updateGrabPosition();
      const wristAngle = Math.atan2((1 - middleBase.x) - (1 - wrist.x), middleBase.y - wrist.y);
      if (!openPalmNow) applyWristRotation(wristAngle);
    }

    function isOpenPalm(marks) {
      const wrist = marks[0];
      const fingerJoints = [[8, 6], [12, 10], [16, 14], [20, 18]];
      let extendedFingers = 0;
      for (const [tipIndex, jointIndex] of fingerJoints) {
        const tip = marks[tipIndex];
        const joint = marks[jointIndex];
        const tipDistance = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
        const jointDistance = Math.hypot(joint.x - wrist.x, joint.y - wrist.y);
        if (tipDistance > jointDistance * 1.16) extendedFingers++;
      }
      return extendedFingers === 4;
    }

    function smoothHandLandmarks(rawMarks) {
      if (!smoothedLandmarks || smoothedLandmarks.length !== rawMarks.length) {
        smoothedLandmarks = rawMarks.map(point => ({ x: point.x, y: point.y, z: point.z || 0 }));
        return smoothedLandmarks;
      }

      for (let i = 0; i < rawMarks.length; i++) {
        const raw = rawMarks[i];
        const smooth = smoothedLandmarks[i];
        const dx = raw.x - smooth.x;
        const dy = raw.y - smooth.y;
        const dz = (raw.z || 0) - smooth.z;
        const speed = Math.hypot(dx, dy, dz * .35);
        // 静止时强平滑，快速移动时提高响应速度。
        const alpha = THREE.MathUtils.clamp(.25 + speed * 10.5, .25, .72);
        smooth.x += dx * alpha;
        smooth.y += dy * alpha;
        smooth.z += dz * alpha;
      }
      return smoothedLandmarks;
    }

    function resetTrackingFilters(keepGrab = false) {
      smoothedLandmarks = null;
      smoothedCursorX = null;
      smoothedCursorY = null;
      smoothedPinchRatio = null;
      previousWristAngle = null;
      pinchStable = keepGrab;
      pinchFrames = 0;
      openPalmFrames = 0;
    }

    function drawSkeleton(marks, width, height) {
      const pairs = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
      handCtx.save();
      handCtx.translate(width, 0);
      handCtx.scale(-1, 1);
      handCtx.strokeStyle = "rgba(215,169,75,.86)";
      handCtx.lineWidth = 3;
      handCtx.lineCap = "round";
      for (const [a, b] of pairs) {
        handCtx.beginPath();
        handCtx.moveTo(marks[a].x * width, marks[a].y * height);
        handCtx.lineTo(marks[b].x * width, marks[b].y * height);
        handCtx.stroke();
      }
      for (let i = 0; i < marks.length; i++) {
        handCtx.beginPath();
        handCtx.arc(marks[i].x * width, marks[i].y * height, i === 8 || i === 4 ? 6 : 3, 0, Math.PI * 2);
        handCtx.fillStyle = i === 8 || i === 4 ? "#f3e5b8" : "#62b49a";
        handCtx.fill();
      }
      handCtx.restore();
    }

    renderer.domElement.addEventListener("pointermove", event => {
      if (handVisible) return;
      setPointerFromScreen(event.clientX, event.clientY);
      updateHover();
      if (mouseDown && grabbed) {
        mouseMovedDistance += Math.hypot(event.movementX, event.movementY);
        updateGrabPosition();
        if (currentStep === 2 && mouseMovedDistance > 45) nextStep(2);
      }
    });

    renderer.domElement.addEventListener("pointerdown", event => {
      if (handVisible || event.button !== 0) return;
      mouseDown = true;
      mouseStart.set(event.clientX, event.clientY);
      mouseMovedDistance = 0;
      setPointerFromScreen(event.clientX, event.clientY);
      updateHover();
      if (hovered) {
        if (currentStep === 0) setStep(1);
        beginGrab();
        if (currentStep < 2) setStep(2);
      }
    });

    window.addEventListener("pointerup", () => {
      if (handVisible) return;
      mouseDown = false;
      finishGrab();
    });

    renderer.domElement.addEventListener("wheel", event => {
      if (!grabbed || handVisible) return;
      event.preventDefault();
      const delta = Math.sign(event.deltaY) * .13;
      movable.rotation.z += delta;
      accumulatedRotation += Math.abs(delta);
      if (currentStep === 3 && accumulatedRotation > .26) nextStep(3);
    }, { passive: false });

    window.addEventListener("keydown", event => {
      if (!grabbed || handVisible) return;
      if (event.key.toLowerCase() === "q" || event.key.toLowerCase() === "e") {
        const delta = event.key.toLowerCase() === "q" ? .13 : -.13;
        movable.rotation.z += delta;
        accumulatedRotation += Math.abs(delta);
        if (currentStep === 3 && accumulatedRotation > .26) nextStep(3);
      }
    });

    startButton.addEventListener("click", () => {
      introEl.classList.add("hidden");
      tutorialStarted = true;
      setStep(0);
    });
    cameraButton.addEventListener("click", startCamera);
    resetButton.addEventListener("click", resetTutorial);
    againButton.addEventListener("click", resetTutorial);

    window.addEventListener("resize", () => {
      camera3d.aspect = innerWidth / innerHeight;
      camera3d.position.z = camera3d.aspect < 1.45 ? 15.4 : 12.5;
      camera3d.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      motes.rotation.y = t * .015;
      floorRing.material.opacity = .17 + Math.sin(t * 2) * .07;
      target.material.opacity = target.material.opacity > 0 ? .18 + Math.sin(t * 2.4) * .08 : 0;
      updateSmoothDrag();
      if (!grabbed && tutorialStarted && movable.position.distanceTo(target.position) > .01) {
        movable.position.y += Math.sin(t * 1.8) * .0007;
      }
      if (grabbed) {
        edges.material.opacity = .75 + Math.sin(t * 6) * .2;
      }
      renderer.render(scene, camera3d);
    }
    animate();
  </script>
</body>
</html>
